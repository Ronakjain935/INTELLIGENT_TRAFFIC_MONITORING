  speed_threshold_px: 4.0
counting:
  cooldown_frames: 15
  line_offset: 12
  line_ratio_y: 0.55
density:
  low: 20
  medium: 50
model:
  confidence: 0.4
  device: auto
  iou: 0.5
  name: yolov8n.pt
  target_classes:
  - 0
  - 1
  - 2
  - 3
  - 5
  - 7
processing:
  frame_skip: 2
  resize_width: 640
  show_boxes: true
  show_counting_line: true
  show_trails: true
storage:
  database_path: data/traffic_system.db
  database_url: sqlite:///data/traffic_system.db
  output_video_dir: data/output
  reports_dir: data/reports
